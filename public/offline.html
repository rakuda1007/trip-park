<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>オフライン — TripPark</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo,
          sans-serif;
        background: #f4f4f5;
        color: #18181b;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #09090b;
          color: #fafafa;
        }
        .card {
          background: #18181b;
          border-color: #3f3f46;
        }
        a {
          background: #fafafa;
          color: #18181b;
        }
      }
      .card {
        max-width: 22rem;
        width: 100%;
        border: 1px solid #e4e4e7;
        border-radius: 0.75rem;
        background: #fff;
        padding: 1.5rem;
      }
      h1 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
      }
      p {
        margin: 0.75rem 0 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #52525b;
      }
      @media (prefers-color-scheme: dark) {
        p {
          color: #a1a1aa;
        }
      }
      a {
        display: inline-flex;
        margin-top: 1.25rem;
        border-radius: 0.375rem;
        background: #18181b;
        color: #fff;
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>オフラインです</h1>
      <p>
        ネットワークに接続できません。以前開いた旅行の画面が端末に残っていれば、そこから再開できる場合があります。
      </p>
      <a href="/dashboard">アプリを開く</a>
    </main>
  </body>
</html>
